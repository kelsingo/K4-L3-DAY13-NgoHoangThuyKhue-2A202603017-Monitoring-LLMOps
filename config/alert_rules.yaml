alerts:
  - name: high_latency_p95
    severity: warning
    condition: latency_p95_ms > 3000
    duration: 5m
    type: symptom-based
    channel: slack
    owner: monitoring-team
    runbook: docs/alerts.md#alert-1

  - name: high_error_rate
    severity: critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack
    owner: monitoring-team
    runbook: docs/alerts.md#alert-2

  - name: low_quality_or_retrieval_success
    severity: warning
    condition: quality_score_avg < 0.75 or retrieval_success_rate_pct < 90
    duration: 10m
    type: symptom-based
    channel: slack
    owner: monitoring-team
    runbook: docs/alerts.md#alert-3
